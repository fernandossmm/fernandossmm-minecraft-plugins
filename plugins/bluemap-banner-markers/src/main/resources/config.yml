# BlueMap Banner Markers
#
# Right-click a placed banner with a name tag (named in an anvil) and the banner becomes a waypoint: the
# tag is used up, the name floats over the banner, and BlueMap shows the banner itself where it stands.
# Hovering it on the map shows the name; clicking it shows who placed it, with their face. Breaking the
# banner removes the waypoint. Only the player who named a banner can rename it.

# Worlds where banners can become waypoints, by name. Empty: every world.
worlds: []

# How many waypoints each player can have. Players with bluemapbannermarkers.unlimited have no limit.
max-per-player: 5

# The longest name a waypoint can have, in characters, from 1 to 50 (the most an anvil allows). A longer
# name tag is refused and kept; waypoints named before a lower limit keep their names.
max-name-length: 24

# The layer in BlueMap's marker menu.
layer:
  label: "Waypoints"
  hidden-by-default: false

# What players read. Chat messages are MiniMessage (https://docs.papermc.io/adventure/minimessage/); an empty
# one is not sent. A message left out keeps its English default.
messages:
  # A player tries to make a waypoint in a world not listed in `worlds`.
  world-not-allowed: "<red>Banners in this world cannot be waypoints."
  # Someone else's waypoint. Placeholders: <owner>, <name>
  not-yours: "<red>This banner is <owner>'s waypoint, \"<name>\". Only <owner> can rename it."
  # No build trust where the banner is (GriefPrevention).
  no-build: "<red>You need permission to build here to make this banner a waypoint."
  # Placeholders: <length>, <max>
  name-too-long: "<red>That name has <length> characters; waypoint names can have at most <max>. Rename the tag in an anvil."
  # Placeholders: <count>, <max>
  limit-reached: "<red>You have <count> waypoints, the most allowed. Break one of your waypoint banners to make a new one."
  # Placeholders: <name>
  added: "<green>Waypoint \"<name>\" added to the map."
  # Placeholders: <name>
  renamed: "<green>Waypoint renamed to \"<name>\"."
  # The map's popup, under the waypoint's name; plain text. Placeholders: <owner>
  placed-by: "Placed by <owner>"
