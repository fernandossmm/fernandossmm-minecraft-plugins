# BlueMap Banner Markers
#
# Right-click a placed banner with a name tag (named in an anvil) and the banner becomes a waypoint: the
# tag is used up, the name floats over the banner, and BlueMap shows the banner itself where it stands.
# Hovering it on the map shows the name; clicking it shows who placed it, with their face. Breaking the
# banner removes the waypoint. Only the player who named a banner can rename it.

# Worlds where banners can become waypoints, by name. Empty: every world.
worlds: []

# How many waypoints each player can have. Players with bluemapbannermarkers.unlimited have no limit.
max-per-player: 5

# The longest name a waypoint can have, in characters, from 1 to 50 (the most an anvil allows). A longer
# name tag is refused and kept; waypoints named before a lower limit keep their names.
max-name-length: 24

# The layer in BlueMap's marker menu.
layer:
  label: "Waypoints"
  hidden-by-default: false
