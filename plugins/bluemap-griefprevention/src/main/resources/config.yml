# BlueMap GriefPrevention
#
# GriefPrevention claims are drawn on every BlueMap map of their world, as flat areas seen through the
# terrain. Claims of the same owner that touch along an edge or overlap become one shape; unclaimed land
# they enclose shows as a hole. A player's claims have the colour of that player on the locator bar.

# Worlds whose claims are drawn, by name. Empty: every world.
worlds: []

# The layer in BlueMap's marker menu.
layer:
  label: "Claims"
  hidden-by-default: false

# Where the owner's name appears:
#   click  only in the popup when someone clicks a claim
#   list   also in BlueMap's marker list (BlueMap shows nothing on hover over an area)
#   none   never
owner: click

# Which claims are drawn. Subdivisions never are: their claim already covers them.
claims:
  player: true
  admin: true

colors:
  admin: "#BF00FF"
  fill-opacity: 0.2
  line-opacity: 0.8
  line-width: 2

# Everything is redrawn this often, to catch changes made without an event (by commands or other plugins).
# A number followed by s, m or h.
resync-interval: 5m
