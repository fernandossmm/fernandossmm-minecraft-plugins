# One version of everything for every plugin. Renovate keeps it current.

[versions]
# The Minecraft version every plugin targets: api-version, Modrinth and Hangar game versions, dev server.
minecraft = "26.3"
paper-api = "26.3.build.244-stable"
junit = "6.1.3"
mockbukkit = "4.119.0"
minotaur = "2.10.0"
hangar-publish = "0.1.4"
run-paper = "3.1.0"
griefprevention = "16.18.7"
bluemap-api = "2.8.2"
axgraves = "1.32.2"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper-api" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
mockbukkit = { module = "org.mockbukkit.mockbukkit:mockbukkit-v26.3", version.ref = "mockbukkit" }
# Third-party plugins ours integrate with; compiled against, never bundled.
griefprevention = { module = "maven.modrinth:griefprevention", version.ref = "griefprevention" }
bluemap-api = { module = "de.bluecolored:bluemap-api", version.ref = "bluemap-api" }
axgraves = { module = "maven.modrinth:axgraves", version.ref = "axgraves" }

# Gradle plugins used by build-logic, by their marker coordinates.
minotaur-gradle = { module = "com.modrinth.minotaur:com.modrinth.minotaur.gradle.plugin", version.ref = "minotaur" }
hangar-publish-gradle = { module = "io.papermc.hangar-publish-plugin:io.papermc.hangar-publish-plugin.gradle.plugin", version.ref = "hangar-publish" }

[plugins]
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-paper" }
